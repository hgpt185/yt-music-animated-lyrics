<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Animated Lyrics for YouTube Music</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 280px;
        margin: 0;
        padding: 20px;
        background: #0f0f0f;
        color: #fff;
        font-family: "YouTube Sans", "Roboto", "Noto Sans", sans-serif;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 16px;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.5;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
        flex: 0 0 auto;
      }
      .switch input {
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        position: absolute;
        cursor: pointer;
        z-index: 1;
      }
      .track {
        position: absolute;
        inset: 0;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.2);
        transition: background 200ms ease;
        pointer-events: none;
      }
      .thumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 200ms ease;
        pointer-events: none;
      }
      .switch input:checked + .track {
        background: #ff0033;
      }
      .switch input:checked + .track + .thumb {
        transform: translateX(18px);
      }
      .hint {
        margin-top: 16px;
        margin-bottom: 0;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
      }
      .donate {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 16px;
        color: #fff;
        font-size: 12px;
        text-decoration: none;
        transition: color 150ms ease;
      }
      .donate:hover {
        color: #fff;
        text-decoration: underline;
      }
      .donate:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
        border-radius: 2px;
      }
      .donate .emoji {
        filter: grayscale(1) brightness(2.4);
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <h1>Animated Lyrics</h1>
    <p>Spotify-style synced lyrics for YouTube Music.</p>
    <div class="row">
      <span>Enable animated lyrics</span>
      <label class="switch">
        <input type="checkbox" id="enabled" checked />
        <span class="track"></span>
        <span class="thumb"></span>
      </label>
    </div>
    <p class="hint">
      Play a song on music.youtube.com and open the Lyrics tab. Click any lyric
      line to jump to that moment.
    </p>
    <a
      class="donate"
      href="https://buymeacoffee.com/hemeshgupta"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="emoji" aria-hidden="true">☕</span>
      Buy me a coffee
    </a>
    <script src="popup.js"></script>
  </body>
</html>
